%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/samsung,s2mpg12-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MPG12 Power Management IC regulators

maintainers:
  - Derek Ross <derekross@gmail.com>

description: |
  This is part of the device tree bindings for the S2MPG12 Power Management
  IC (PMIC). Only its 28 LDO regulators are described so far. The buck
  converters are not.

  See also Documentation/devicetree/bindings/mfd/samsung,s2mpg12-pmic.yaml.

patternProperties:
  "^ldo([1-9]|1[0-9]|2[0-8])m$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false
    description:
      Properties for a single LDO regulator.
    properties:
      regulator-ramp-delay: false

additionalProperties: false
